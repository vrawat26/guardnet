<!DOCTYPE html>
<html>
<head>
<title>Parental Control Pro</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    margin: 0;
}

header {
    padding: 20px;
    background: #1e293b;
}

.container {
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
}

button {
    padding: 8px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>

</head>

<body>

<header>
<h2>Parental Control Dashboard</h2>
</header>

<div class="container">

<div class="card">
<h3>Devices</h3>
<button onclick="load()">Refresh</button>
<pre id="devices"></pre>
</div>

<div class="card">
<h3>Set Screen Limit</h3>
<input id="dev" placeholder="device id"><br><br>
<input id="limit" placeholder="minutes"><br><br>
<button onclick="setLimit()">Apply</button>
</div>

</div>

<script>

const SERVER = "https://your-render-url.onrender.com";

async function load(){
    let res = await fetch(SERVER + "/devices");
    let data = await res.json();

    document.getElementById("devices").innerText =
        JSON.stringify(data, null, 2);
}

async function setLimit(){
    let device = document.getElementById("dev").value;
    let limit = document.getElementById("limit").value;

    await fetch(SERVER + "/set_limit?device_id="+device+"&limit="+limit, {
        method:"POST"
    });

    alert("Updated!");
}

setInterval(load, 3000);
load();

</script>

</body>
</html>
